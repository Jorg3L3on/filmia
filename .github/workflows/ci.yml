name: CI

on:
  pull_request:
    branches: [sandbox, main]
  push:
    branches: [sandbox, main]

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify
      - name: build (optional)
        continue-on-error: true
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-for-production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
