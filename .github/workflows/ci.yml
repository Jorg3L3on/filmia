name: CI

on:
  pull_request:
    branches: [sandbox, main]
  push:
    branches: [sandbox, main]

# FIL-I10-6 L5: the job only reads the repo.
permissions:
  contents: read

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    # FIL-I20: DB-backed tests (MCP connector, shared writes) run against a throwaway Postgres.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/filmia_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:db:setup
      - run: npm run test:db
      - run: npm run verify
      - name: build (optional)
        continue-on-error: true
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret-not-for-production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
